<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelhams</title>
    <meta name="theme-color" content="#0f190f" />
    <link rel="preload" href="assets/fonts/elan-book.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Elan";
        src: url("assets/fonts/elan-book.woff2") format("woff2");
        font-display: block;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: rgb(15 25 15);
        color: rgb(254 250 242);
        -webkit-font-smoothing: antialiased;
      }

      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        font: normal min(10.5vw, 17vh) / 0.93 "Elan", serif;
        text-align: center;
        white-space: nowrap;
      }

      .lockup span {
        opacity: 0;
        transform: translateY(0.12em);
        animation: reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .lockup span:nth-child(1) { animation-delay: 0.3s; }
      .lockup span:nth-child(2) { animation-delay: 1.1s; }
      .lockup span:nth-child(3) { animation-delay: 1.9s; }

      /* Last line sits optically centred */
      .lockup .nudge {
        text-indent: -0.42em;
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .lockup span {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="lockup" aria-label="Lincolnshire, Pelhams, c. 1565">
      <span>LINCOLNSHIRE</span>
      <span>PELHAMS</span>
      <span class="nudge">c. 1565</span>
    </h1>
  </body>
</html>
