<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelham</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a2332;
        --mist: #e8eef5;
        --accent: #2d6a4f;
        --glow: #95d5b2;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 60% at 20% 30%, rgba(149, 213, 178, 0.35), transparent),
          radial-gradient(ellipse 70% 50% at 80% 70%, rgba(45, 106, 79, 0.12), transparent),
          linear-gradient(165deg, #f7faf8 0%, var(--mist) 50%, #dfe8f0 100%);
        animation: wash 12s ease-in-out infinite alternate;
      }

      @keyframes wash {
        from {
          background-position: 0% 0%, 100% 100%, 0 0;
        }
        to {
          background-position: 10% 20%, 90% 80%, 0 0;
        }
      }

      main {
        text-align: center;
        padding: 2rem;
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(1.25rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        font-family: "Fraunces", serif;
        font-size: clamp(3rem, 10vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--ink);
      }

      .brand span {
        color: var(--accent);
      }

      p {
        margin-top: 1rem;
        font-size: 1.125rem;
        font-weight: 400;
        color: #3d4f63;
        opacity: 0;
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }

      .dot {
        display: inline-block;
        width: 0.5rem;
        height: 0.5rem;
        margin: 0 0.15em 0.1em;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 0 0 rgba(149, 213, 178, 0.5);
        animation: pulse 2.4s ease-in-out infinite;
        vertical-align: middle;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(149, 213, 178, 0.45);
        }
        50% {
          box-shadow: 0 0 0 0.5rem rgba(149, 213, 178, 0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand">Pelham<span class="dot" aria-hidden="true"></span></h1>
      <p>Hello, world — welcome to Pelham.</p>
    </main>
  </body>
</html>
