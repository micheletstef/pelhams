<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelhams</title>
    <meta name="theme-color" content="#000000" />
    <link rel="preload" href="assets/fonts/elan-book.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Elan";
        src: url("assets/fonts/elan-book.woff2") format("woff2");
        font-display: block;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .lockup {
        --fs: min(10.5vw, 17vh);
        margin: 0;
        font: normal var(--fs) / 0.93 "Elan", serif;
        text-align: center;
        white-space: nowrap;
      }

      /* Last line sits optically centred */
      .lockup .nudge {
        text-indent: -0.42em;
      }

      .lockup span {
        display: block;
        visibility: hidden;
        animation: appear 0s forwards;
      }

      .lockup span:nth-child(1) {
        animation-delay: 0.4s;
      }
      .lockup span:nth-child(2) {
        animation-delay: 1s;
      }
      .lockup span:nth-child(3) {
        animation-delay: 1.6s;
      }

      @keyframes appear {
        to {
          visibility: visible;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .lockup span {
          animation: none;
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="lockup" aria-label="Lincolnshire, Pelhams, c. 1565">
      <span>LINCOLNSHIRE</span>
      <span>PELHAMS</span>
      <span class="nudge">c. 1565</span>
    </h1>
  </body>
</html>
