<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelhams</title>
    <meta name="theme-color" content="#0f190f" />
    <script>
      (() => {
        const DAY_START = 7;
        const NIGHT_START = 19;
        const meta = document.querySelector('meta[name="theme-color"]');
        function apply() {
          const hour = new Date().getHours();
          const theme = hour >= DAY_START && hour < NIGHT_START ? 'light' : 'dark';
          if (document.documentElement.dataset.theme === theme) return;
          document.documentElement.dataset.theme = theme;
          meta.content = theme === 'light' ? '#f4f1ea' : '#0f190f';
          document.dispatchEvent(new Event('themechange'));
        }
        apply();
        setInterval(apply, 60000);
      })();
    </script>
    <style>
      html {
        background: rgb(15 25 15);
        color: #fff;
      }

      html[data-theme="light"] {
        background: #f4f1ea;
        color: rgb(15 25 15);
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .icon {
        display: block;
        width: min(60vw, 60vh);
        height: min(60vw, 60vh);
      }
    </style>
  </head>
  <body>
    <canvas class="icon" role="img" aria-label="Pelhams"></canvas>
    <script src="assets/icons.js" defer></script>
  </body>
</html>
