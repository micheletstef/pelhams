<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelhams</title>
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preload" href="assets/fonts/elan-book.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Elan";
        src: url("assets/fonts/elan-book.woff2") format("woff2");
        font-display: block;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      body.is-light {
        background: #f2f0ea;
        color: #141414;
      }

      .signet-wrap {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: clamp(448px, 73.6vw, 1120px);
        max-width: calc(100% - 2rem);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .signet {
        display: block;
        width: 100%;
        overflow: visible;
      }

      .signet path {
        fill: none;
        stroke: currentColor;
        stroke-width: 4.2;
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        animation: write 2.4s linear forwards;
      }

      .lockup {
        --fs: min(10.5vw, 17vh);
        position: relative;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        font: normal var(--fs) / 0.93 "Elan", serif;
        text-align: center;
        white-space: nowrap;
        /* Optical centre against the signet (caps sit high in the line box) */
        transform: translateY(0.35em);
      }

      /* Last line sits optically centred */
      .lockup .nudge {
        text-indent: -0.42em;
      }

      .lockup span {
        visibility: hidden;
        animation: appear 0s forwards;
      }

      .lockup span:nth-child(1) {
        animation-delay: 0.4s;
      }
      .lockup span:nth-child(2) {
        animation-delay: 1s;
      }
      .lockup span:nth-child(3) {
        animation-delay: 1.6s;
      }

      @keyframes appear {
        to {
          visibility: visible;
        }
      }

      @keyframes write {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .signet path {
          animation: none;
          stroke-dashoffset: 0;
        }

        .lockup span {
          animation: none;
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="lockup" aria-label="Lincolnshire, Pelhams, c. 1565">
      <span>LINCOLNSHIRE</span>
      <span>PELHAMS</span>
      <span class="nudge">c. 1565</span>
    </h1>
    <div class="signet-wrap">
      <svg class="signet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556.6 464" aria-hidden="true">
        <path pathLength="1" d="M278.3 3.4C460.5 3.4 553.2 40.9 553.2 232C553.2 423.1 460.5 460.6 278.3 460.6H274.3" />
        <path pathLength="1" d="M278.3 3.4C96.1 3.4 3.4 40.9 3.4 232C3.4 423.1 96.1 460.6 278.3 460.6H282.3" />
      </svg>
    </div>
    <script>
      (() => {
        const wrap = document.querySelector(".signet-wrap");
        const meta = document.querySelector('meta[name="theme-color"]');
        let light = false;

        const setTheme = (isLight) => {
          light = isLight;
          document.body.classList.toggle("is-light", isLight);
          meta.content = isLight ? "#f2f0ea" : "#000000";
        };

        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          setTheme(true);
          return;
        }

        const bind = (signet) => {
          const path = signet.querySelector("path");
          if (!path) return;
          path.addEventListener(
            "animationend",
            (event) => {
              if (event.animationName !== "write") return;
              setTheme(!light);
              const next = signet.cloneNode(true);
              signet.replaceWith(next);
              bind(next);
            },
            { once: true }
          );
        };

        bind(wrap.querySelector(".signet"));
      })();
    </script>
  </body>
</html>
