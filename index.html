<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelhams</title>
    <meta name="theme-color" content="#000000" />
    <link rel="preload" href="assets/fonts/elan-book.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Elan";
        src: url("assets/fonts/elan-book.woff2") format("woff2");
        font-display: block;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      body.is-complete {
        background: #f2f0ea;
        color: #141414;
      }

      .signet-wrap {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: clamp(448px, 73.6vw, 1120px);
        max-width: calc(100% - 2rem);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .signet {
        display: block;
        width: 100%;
        overflow: visible;
      }

      .signet path {
        fill: none;
        stroke: currentColor;
        stroke-width: 4.2;
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        animation: write 2.4s linear forwards;
      }

      .wordmark {
        position: absolute;
        top: 2.5%;
        left: 50%;
        width: min(90%, 640px);
        fill: currentColor;
        transform: translateX(-50%);
        visibility: hidden;
      }

      .lockup {
        --fs: min(10.5vw, 17vh);
        position: relative;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        font: normal var(--fs) / 0.93 "Elan", serif;
        text-align: center;
        white-space: nowrap;
        /* Optical centre against the signet (caps sit high in the line box) */
        transform: translateY(0.35em);
      }

      /* Last line sits optically centred */
      .lockup .nudge {
        text-indent: -0.42em;
      }

      .lockup span {
        visibility: hidden;
        animation: appear 0s forwards;
      }

      .lockup span:nth-child(1) {
        animation-delay: 0.4s;
      }
      .lockup span:nth-child(2) {
        animation-delay: 1s;
      }
      .lockup span:nth-child(3) {
        animation-delay: 1.6s;
      }

      body.is-complete .lockup,
      body.is-complete .lockup span {
        visibility: hidden !important;
        animation: none !important;
      }

      body.is-complete .wordmark {
        visibility: visible;
      }

      @keyframes appear {
        to {
          visibility: visible;
        }
      }

      @keyframes write {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .signet path {
          animation: none;
          stroke-dashoffset: 0;
        }

        .lockup span {
          animation: none;
          visibility: visible;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const path = document.querySelector(".signet path");
        const meta = document.querySelector('meta[name="theme-color"]');
        const complete = () => {
          document.body.classList.add("is-complete");
          meta.content = "#f2f0ea";
        };
        if (!path || matchMedia("(prefers-reduced-motion: reduce)").matches) {
          complete();
          return;
        }
        path.addEventListener("animationend", complete, { once: true });
      })();
