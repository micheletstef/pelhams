<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelhams</title>
    <meta name="theme-color" content="#0f190f" />
    <link rel="preload" href="assets/fonts/elan-book.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Elan";
        src: url("assets/fonts/elan-book.woff2") format("woff2");
        font-display: block;
      }

      body {
        margin: 0;
        background: rgb(15 25 15);
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }

      .intro {
        --fs: min(10.5vw, 17vh);
        position: relative;
        overflow-x: clip;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Lockup is 3 lines at 0.93 line height; this centres it in the first screen */
        padding-top: calc(50svh - 1.395 * var(--fs));
        padding-bottom: 8vw;
      }

      .signet {
        flex: none;
        width: clamp(560px, 92vw, 1400px);
        margin-top: calc(0.6 * var(--fs));
        overflow: visible;
      }

      .signet path {
        fill: none;
        stroke: currentColor;
        stroke-width: 5.8;
        stroke-dasharray: 1 1;
        stroke-dashoffset: 1;
        animation: write 2.4s cubic-bezier(0.65, 0, 0.35, 1) 2.4s forwards;
      }

      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        font: normal var(--fs) / 0.93 "Elan", serif;
        text-align: center;
        white-space: nowrap;
      }

      /* Last line sits optically centred */
      .lockup .nudge {
        text-indent: -0.42em;
      }

      .wordmark {
        position: absolute;
        left: 50%;
        top: 6vh;
        width: min(36vw, 280px);
        translate: -50% 0;
        fill: currentColor;
      }

      .lockup span {
        visibility: hidden;
        animation: appear 0s forwards;
      }
      .lockup span:nth-child(1) { animation-delay: 0.4s; }
      .lockup span:nth-child(2) { animation-delay: 1s; }
      .lockup span:nth-child(3) { animation-delay: 1.6s; }

      @keyframes appear {
        to {
          visibility: visible;
        }
      }

      /* Each mask stroke follows the pen path; delays are set inline per stroke */
      .wordmark .pen path {
        stroke-dasharray: 1 1;
        stroke-dashoffset: 1;
        animation-name: write;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }

      @keyframes write {
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wordmark .pen path,
        .signet path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
