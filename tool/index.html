<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cylinder Wrap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Cylinder Wrap</h1>

        <fieldset>
          <legend>Source</legend>
          <p>
            <input id="file-input" type="file" accept=".pdf,.svg,application/pdf,image/svg+xml" />
          </p>
          <p id="file-label">No file selected</p>
          <p>
            <label>PDF page <input id="pdf-page" type="number" min="1" value="1" step="1" size="4" /></label>
            <label>DPI <input id="source-dpi" type="number" min="72" max="600" value="300" step="1" size="5" /></label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Cylinder</legend>
          <p>
            <label>Curvature <input id="curvature" type="range" min="0" max="2" value="1" step="0.01" /></label>
            <span id="curvature-val">1.00</span>
          </p>
          <p>
            <label>Visible arc <input id="arc" type="range" min="40" max="180" value="160" step="1" /></label>
            <span id="arc-val">160°</span>
          </p>
          <p>
            <label>Edge warp <input id="edge-warp" type="range" min="0" max="2" value="1" step="0.01" /></label>
            <span id="edge-warp-val">1.00</span>
          </p>
          <p>
            <label>Perspective <input id="perspective" type="range" min="0" max="1.5" value="0.35" step="0.01" /></label>
            <span id="perspective-val">0.35</span>
          </p>
          <p>
            <label>Vertical bow <input id="v-bow" type="range" min="-0.5" max="0.5" value="0" step="0.01" /></label>
            <span id="v-bow-val">0.00</span>
          </p>
        </fieldset>

        <fieldset>
          <legend>Transform</legend>
          <p>
            <label>Scale X <input id="scale-x" type="range" min="0.2" max="3" value="1" step="0.01" /></label>
            <span id="scale-x-val">1.00</span>
          </p>
          <p>
            <label>Scale Y <input id="scale-y" type="range" min="0.2" max="3" value="1" step="0.01" /></label>
            <span id="scale-y-val">1.00</span>
          </p>
          <p>
            <label>Rotate <input id="rotate" type="range" min="-180" max="180" value="0" step="0.1" /></label>
            <span id="rotate-val">0°</span>
          </p>
          <p>
            <label>Offset X <input id="offset-x" type="range" min="-100" max="100" value="0" step="0.1" /></label>
            <span id="offset-x-val">0%</span>
          </p>
          <p>
            <label>Offset Y <input id="offset-y" type="range" min="-100" max="100" value="0" step="0.1" /></label>
            <span id="offset-y-val">0%</span>
          </p>
        </fieldset>

        <fieldset>
          <legend>Shading & crop</legend>
          <p>
            <label>Side falloff <input id="falloff" type="range" min="0" max="1" value="0" step="0.01" /></label>
            <span id="falloff-val">0.00</span>
          </p>
          <p>
            <label>Crop sides <input id="crop" type="range" min="0" max="40" value="0" step="0.5" /></label>
            <span id="crop-val">0%</span>
          </p>
          <p>
            <label><input id="clip-cylinder" type="checkbox" checked /> Clip to cylinder</label>
          </p>
          <p>
            <label><input id="show-guides" type="checkbox" /> Show guides</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Output</legend>
          <p>
            <label>Width <input id="out-w" type="number" min="200" max="8000" value="1600" step="1" size="6" /></label>
            <label>Height <input id="out-h" type="number" min="200" max="8000" value="2000" step="1" size="6" /></label>
          </p>
          <p>
            <label>
              Background
              <select id="bg-mode">
                <option value="transparent" selected>Transparent</option>
                <option value="solid">Solid</option>
              </select>
            </label>
            <input id="bg-color" type="color" value="#808080" disabled />
          </p>
          <p>
            <button type="button" id="btn-reset">Reset</button>
            <button type="button" id="btn-export" disabled>Export PNG</button>
            <button type="button" id="btn-fit" disabled>Fit</button>
            <button type="button" id="btn-redraw" disabled>Redraw</button>
          </p>
        </fieldset>
      </aside>

      <main class="stage">
        <p id="status">Upload a PDF or SVG to begin</p>
        <div class="viewport" id="viewport">
          <canvas id="preview" width="1600" height="2000"></canvas>
        </div>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
