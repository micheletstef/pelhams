<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cylinder Wrap</title>
    <link rel="stylesheet" href="styles.css?v=20260811-finish-visibility" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="panel-head">
          <h1>Cylinder Wrap</h1>
          <p id="bottle-stats" class="stats"></p>
        </header>

        <fieldset>
          <legend>Vessel</legend>
          <div class="row">
            <select id="vessel" class="grow">
              <option value="bottle75cl" selected>Rheinwein 75cl bottle</option>
              <option value="keule500">Keule Softdrink 500ml</option>
              <option value="can330">330 ml aluminum can</option>
            </select>
          </div>
          <div class="row" id="vessel-finish-row" hidden>
            <label class="field grow">
              Finish
              <select id="vessel-finish">
                <option value="white">White</option>
                <option value="softMetal" selected>Soft metal</option>
                <option value="glossyMetal">Glossy metal</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Source</legend>
          <div class="row">
            <input id="file-input" type="file" accept=".pdf,.svg,application/pdf,image/svg+xml" />
          </div>
          <p id="file-label" class="file-name">No file selected</p>
          <div class="row">
            <label class="field">Page <input id="pdf-page" type="number" min="1" value="1" step="1" /></label>
            <label class="field">DPI <input id="source-dpi" type="number" min="72" max="600" value="300" step="1" /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Label</legend>
          <div class="row">
            <label class="field">W <input id="label-width" type="number" min="5" max="2000" value="120" step="0.1" /> mm</label>
            <label class="field">H <input id="label-height" type="number" min="5" max="1000" value="105" step="0.1" /> mm</label>
            <label class="check" title="Lock base size; use Scale to resize">
              <input id="lock-label-size" type="checkbox" checked /> Lock
            </label>
            <button type="button" id="btn-native-size" title="Reset W/H to artwork native size">Native</button>
          </div>
          <div class="slider-row">
            <span class="slider-label">Scale</span>
            <input id="label-scale" type="range" min="0.25" max="2.5" value="1" step="0.01" />
            <span id="label-scale-val" class="val">100%</span>
          </div>
          <p id="label-arc-readout" class="stats muted"></p>

          <div class="slider-row">
            <span class="slider-label">Rotate</span>
            <input id="rotate" type="range" min="-180" max="180" value="0" step="0.1" />
            <span id="rotate-val" class="val">0°</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Offset X</span>
            <input id="offset-x" type="range" min="-100" max="100" value="0" step="0.1" />
            <span id="offset-x-val" class="val">0%</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Offset Y</span>
            <input id="offset-y" type="range" min="-100" max="100" value="0" step="0.1" />
            <span id="offset-y-val" class="val">0%</span>
          </div>

          <div class="row colors">
            <label class="swatch">
              Ink
              <input id="art-color" type="color" value="#000000" />
            </label>
            <label class="swatch">
              Paper
              <input id="paper-color" type="color" value="#ffffff" />
            </label>
            <label class="check">
              <input id="knockout-white" type="checkbox" checked />
              Knock out paper
            </label>
            <label class="check">
              <input id="use-artwork-colors" type="checkbox" />
              Artwork colors
            </label>
          </div>
          <div class="row">
            <label class="field grow">
              Blend
              <select id="art-blend">
                <option value="opaque" selected>Opaque</option>
                <option value="multiply">Multiply</option>
                <option value="darken">Darken</option>
                <option value="lighten">Lighten</option>
                <option value="screen">Screen</option>
                <option value="overlay">Overlay</option>
                <option value="soft-light">Soft light</option>
                <option value="hard-light">Hard light</option>
                <option value="color-burn">Color burn</option>
                <option value="color-dodge">Color dodge</option>
              </select>
            </label>
          </div>
          <div class="checks">
            <label class="check"><input id="show-mockup" type="checkbox" checked /> Mockup</label>
          </div>
        </fieldset>

        <details class="fold" open id="fold-projection">
          <summary>
            <span>Projection</span>
            <label class="summary-toggle" onclick="event.stopPropagation()">
              <input id="projection-enabled" type="checkbox" checked /> On
            </label>
            <button type="button" id="btn-reset-projection" class="btn-inline" onclick="event.stopPropagation()" title="Reset projection">Reset</button>
          </summary>
          <div class="slider-row">
            <span class="slider-label">Edge curve</span>
            <input id="edge-curve" type="range" min="-2" max="2" value="0" step="0.01" />
            <span id="edge-curve-val" class="val">0%</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Inner curve</span>
            <input id="inner-curve" type="range" min="-2" max="2" value="0" step="0.01" />
            <span id="inner-curve-val" class="val">0%</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Curve start</span>
            <input id="curve-start" type="range" min="0" max="100" value="50" step="1" />
            <span id="curve-start-val" class="val">50%</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Curve blend</span>
            <input id="curve-blend" type="range" min="0" max="100" value="0" step="1" />
            <span id="curve-blend-val" class="val">0%</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Vert curve</span>
            <input id="vert-curve" type="range" min="-1" max="1" value="0" step="0.01" />
            <span id="vert-curve-val" class="val">None</span>
          </div>
        </details>

        <details class="fold" id="fold-shading">
          <summary>
            <span>Shading &amp; crop</span>
            <label class="summary-toggle" onclick="event.stopPropagation()">
              <input id="shading-enabled" type="checkbox" checked /> On
            </label>
          </summary>
          <div class="slider-row">
            <span class="slider-label">Edge fade</span>
            <input id="edge-fade" type="range" min="0" max="1" value="0" step="0.01" />
            <span id="edge-fade-val" class="val">0.00</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Fade start</span>
            <input id="fade-start" type="range" min="0" max="100" value="60" step="1" />
            <span id="fade-start-val" class="val">60%</span>
          </div>
          <div class="slider-row">
            <span class="slider-label">Crop sides</span>
            <input id="crop" type="range" min="0" max="40" value="0" step="0.5" />
            <span id="crop-val" class="val">0%</span>
          </div>
        </details>

        <fieldset>
          <legend>Output</legend>
          <div class="row">
            <label class="field grow">
              Export
              <select id="export-target">
                <option value="artwork" selected>Artwork only</option>
                <option value="mockup">Bottle mockup</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label class="field">W <input id="out-w" type="number" min="200" max="8000" value="424" step="1" /></label>
            <label class="field">H <input id="out-h" type="number" min="200" max="8000" value="2068" step="1" /></label>
          </div>
          <div class="btn-row">
            <button type="button" id="btn-export" disabled>PNG</button>
            <button type="button" id="btn-export-pdf" disabled>PDF</button>
            <button type="button" id="btn-export-svg" disabled>SVG</button>
            <button type="button" id="btn-fit" disabled>Fit</button>
            <button type="button" id="btn-redraw" disabled>Redraw</button>
            <button type="button" id="btn-reset">Reset</button>
          </div>
        </fieldset>
      </aside>

      <main class="stage">
        <div class="viewport" id="viewport">
          <div class="viewport-stage" id="viewport-stage">
            <canvas id="preview" width="1400" height="2000"></canvas>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="app.js?v=20260813-artwork-colors"></script>
  </body>
</html>
